<button type=button @click="selectTag('@@tag@@')" class="flex items-center justify-between py-1.5 text-left text-sm transition-colors" :class="tagFilter === '@@tag@@' ? 'text-black dark:text-white font-medium' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100'">
<span class="flex items-center gap-2.5"><span>@@title@@</span>
</span><span class="text-xs tabular-nums text-gray-300 dark:text-gray-600">@@count@@</span>
</button>
